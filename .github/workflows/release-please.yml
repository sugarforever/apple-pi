name: Release please

# Maintains a "Release vX.Y.Z" pull request on every merge to main. Merging that
# pull request is the release decision: it writes the version bump and the
# changelog, then creates the tag and a DRAFT GitHub release. The package
# workflow, which runs on the tag, owns everything after that — building,
# signing, notarizing, attaching assets, and publishing.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

# Never cancel a run in flight: an interrupted run can leave the release pull
# request and the manifest out of step.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
