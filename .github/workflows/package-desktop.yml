name: Package desktop

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/package-desktop.yml"
      - "apps/desktop/**"
      - "apps/agent-host/**"
      - "packages/pi-adapter/**"
      - "packages/protocol/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare-release:
    name: Prepare GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" == "true" ]] || {
              echo "Release $TAG_NAME is already published; refusing to replace public assets" >&2
              exit 1
            }
          else
            gh release create "$TAG_NAME" --draft --verify-tag --generate-notes --title "$TAG_NAME"
          fi

  pr-check:
    name: Test and build Electron app
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.25.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Smoke-test built agent host
        run: pnpm --filter @apple-pi/desktop exec vitest run src/main/agent-host-package.test.ts

  package:
    name: Package ${{ matrix.os-name }} ${{ matrix.arch }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: macos
            builder-os: mac
            arch: arm64
            runner: macos-15
            package-command: package:mac
            app-dir: mac-arm64
            required_suffixes: .dmg,.zip
          - os-name: macos
            builder-os: mac
            arch: x64
            runner: macos-15-intel
            package-command: package:mac
            app-dir: mac
            required_suffixes: .dmg,.zip
          - os-name: windows
            builder-os: win
            arch: x64
            runner: windows-latest
            package-command: package:win
            required_suffixes: -setup.exe,-portable.exe
          - os-name: linux
            builder-os: linux
            arch: x64
            runner: ubuntu-latest
            package-command: package:linux
            required_suffixes: .AppImage,.deb
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.25.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Test protocol schemas
        run: pnpm --filter @apple-pi/protocol test

      - name: Test Pi compatibility
        run: pnpm test:pi-compatibility

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke-test packaged host
        run: pnpm test:host-smoke

      - name: Build native packages
        if: matrix.os-name != 'macos' || github.ref_type != 'tag'
        run: pnpm ${{ matrix.package-command }}

      - name: Validate macOS release secrets
        if: matrix.os-name == 'macos' && github.ref_type == 'tag'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Invalid APPLE_API_KEY_ID" >&2; exit 1; }
          [[ "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Invalid APPLE_API_ISSUER" >&2; exit 1; }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Invalid APPLE_TEAM_ID" >&2; exit 1; }

      - name: Prepare macOS notarization credentials
        if: matrix.os-name == 'macos' && github.ref_type == 'tag'
        id: signing
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: node apps/desktop/scripts/prepare-macos-signing.mjs

      - name: Build signed and notarized macOS packages
        if: matrix.os-name == 'macos' && github.ref_type == 'tag'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.signing.outputs.apple_api_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @apple-pi/desktop package:mac:signed

      - name: Remove temporary notarization credentials
        if: always() && matrix.os-name == 'macos' && github.ref_type == 'tag'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          if [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f -- "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          fi

      - name: Verify macOS signature and notarization ticket
        if: matrix.os-name == 'macos' && github.ref_type == 'tag'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          app_path="apps/desktop/release/${{ matrix.app-dir }}/Apple Pi.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          team_id="$(codesign -dv --verbose=4 "$app_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [[ "$team_id" == "$APPLE_TEAM_ID" ]] || { echo "Unexpected signing team" >&2; exit 1; }
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify packaged agent-host layout and handshake
        run: node apps/desktop/scripts/verify-packaged-app.mjs

      - name: Collect packages and checksums
        id: artifacts
        env:
          APPLE_PI_OS: ${{ matrix.os-name }}
          APPLE_PI_BUILDER_OS: ${{ matrix.builder-os }}
          APPLE_PI_ARCH: ${{ matrix.arch }}
          APPLE_PI_REQUIRED_SUFFIXES: ${{ matrix.required_suffixes }}
        run: node apps/desktop/scripts/collect-package-artifacts.mjs

      - name: Upload native packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          ARTIFACT_PATH: ${{ steps.artifacts.outputs.artifact_path }}
        shell: bash
        run: |
          gh release upload "$TAG_NAME" "$ARTIFACT_PATH"/* --clobber

  publish-release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
