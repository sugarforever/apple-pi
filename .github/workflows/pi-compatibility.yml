name: Pi compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pi-compatibility:
    name: Pi SDK and persistence gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.25.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Test protocol schemas
        run: pnpm --filter @apple-pi/protocol test

      - name: Test Pi compatibility
        run: pnpm test:pi-compatibility

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke-test packaged host
        run: pnpm test:host-smoke
